name: measure-linux-sha256-conversion

# Measure how long converting the linux repository to SHA-256 takes on a
# standard GitHub-hosted runner, and how much disk and memory it needs. The
# source is fetched the same way the `stress` target in the `Makefile` does.

on:
  push:
    branches:
      - claude/measure-linux-sha256-conversion

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    defaults:
      run:
        shell: bash

    steps:
      - name: Show the environment
        run: |
          set -euo pipefail
          git version
          nproc
          free -h
          df -h / /mnt || df -h /

      - name: Free disk space by removing large preinstalled toolchains
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt || df -h /

      - name: Fetch linux as the Makefile does
        run: |
          set -euo pipefail
          mkdir -p linux.git
          cd linux.git
          git init --bare --quiet
          git remote add origin https://github.com/torvalds/linux
          /usr/bin/time -v -o ../fetch-time.txt git fetch --quiet
          grep -E 'Elapsed|Maximum resident' ../fetch-time.txt
          git count-objects -vH
          git for-each-ref --format='%(refname)' | sed -E 's|/[^/]*$||' | sort | uniq -c
          df -h .

      - name: Convert to SHA-256 with fast-export and fast-import
        run: |
          set -euo pipefail
          git init --bare --quiet --object-format=sha256 linux-sha256.git
          git -C linux-sha256.git rev-parse --show-object-format
          options=(--all --reencode=no --signed-tags=verbatim)
          if git fast-export -h 2>&1 | grep -q -- '--signed-commits'; then
            options+=(--signed-commits=verbatim)
          fi
          echo "fast-export options: ${options[*]}"
          # Record disk use every minute, to capture its peak during conversion.
          (while sleep 60; do printf '%s ' "$(date -u +%H:%M:%S)"; df -B1M --output=used,avail / | tail -n 1; done) > disk-log.txt &
          logger=$!
          start=$(date +%s)
          /usr/bin/time -v -o export-time.txt git -C linux.git fast-export "${options[@]}" |
            /usr/bin/time -v -o import-time.txt git -C linux-sha256.git fast-import --stats 2> import-stats.txt
          end=$(date +%s)
          kill "$logger"
          echo "Conversion wall time: $((end - start)) seconds"
          echo '--- fast-export'; grep -E 'Elapsed|Maximum resident|User time|System time' export-time.txt
          echo '--- fast-import'; grep -E 'Elapsed|Maximum resident|User time|System time' import-time.txt
          echo '--- fast-import statistics'; cat import-stats.txt
          echo '--- disk use over time (MiB used, MiB available)'; cat disk-log.txt
          git -C linux-sha256.git count-objects -vH
          ls -la linux-sha256.git/objects/pack/
          df -h .

      - name: Compare object counts and refs
        run: |
          set -euo pipefail
          for repo in linux.git linux-sha256.git; do
            echo "$repo: $(git -C "$repo" cat-file --batch-all-objects --batch-check='%(objecttype)' | sort | uniq -c | tr '\n' ' ')"
            echo "$repo refs: $(git -C "$repo" for-each-ref | wc -l)"
          done

      - name: Repack the converted repository
        timeout-minutes: 240
        run: |
          set -euo pipefail
          /usr/bin/time -v -o repack-time.txt git -C linux-sha256.git repack -adf --quiet
          grep -E 'Elapsed|Maximum resident|User time|System time' repack-time.txt
          git -C linux-sha256.git count-objects -vH
          ls -la linux-sha256.git/objects/pack/
          df -h .
